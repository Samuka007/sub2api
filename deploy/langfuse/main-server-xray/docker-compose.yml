name: langfuse-xray-portal

services:
  xray-portal:
    image: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:26.5.9}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Keep the container listener unprivileged; Docker publishes the public
      # server port (443 by default) on the host.
      - "0.0.0.0:${XRAY_SERVER_PORT:-443}:31590"
      - "${XRAY_PORTAL_BIND_IP:-172.18.0.1}:${XRAY_PORTAL_PORT:-3100}:3100"
    volumes:
      - ./config.json:/usr/local/etc/xray/config.json:ro
    command: ["run", "-config", "/usr/local/etc/xray/config.json"]
    mem_limit: 512m
