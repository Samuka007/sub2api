# Exact production application images with isolated local data and infrastructure.
services:
  sub2api:
    image: sub2api:pricing-model-iq-v0.1.160-v2
    pull_policy: never
    container_name: sub2api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    volumes:
      - ./data/prod-parity:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: ${SERVER_MODE:-release}
      RUN_MODE: ${RUN_MODE:-standard}
      CODEX_RADAR_ENABLED: ${CODEX_RADAR_ENABLED:-false}
      CODEX_RADAR_BASE_URL: ${CODEX_RADAR_BASE_URL:-https://codexradar.com/api/v1/current}
      CODEX_RADAR_API_TOKEN: ${CODEX_RADAR_API_TOKEN:-}
      CODEX_RADAR_TIMEOUT: ${CODEX_RADAR_TIMEOUT:-15s}
      CODEX_RADAR_CACHE_TTL: ${CODEX_RADAR_CACHE_TTL:-5m}
      DATABASE_HOST: infra-postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-sub2api}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_DBNAME: ${DATABASE_DBNAME:-sub2api}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-50}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME_MINUTES: ${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: ${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}
      REDIS_HOST: infra-redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-1024}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-10}
      REDIS_ENABLE_TLS: ${REDIS_ENABLE_TLS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sub2api.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      SETUP_MIGRATION_TIMEOUT_SECONDS: ${SETUP_MIGRATION_TIMEOUT_SECONDS:-0}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      TZ: ${TZ:-Asia/Shanghai}
      SECURITY_URL_ALLOWLIST_ENABLED: ${SECURITY_URL_ALLOWLIST_ENABLED:-false}
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: ${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-true}
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: ${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-true}
      SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: ${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
      GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT: ${GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT:-0}
      GATEWAY_OPENAI_HTTP2_ENABLED: ${GATEWAY_OPENAI_HTTP2_ENABLED:-true}
      GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1: ${GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1:-true}
      GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD: ${GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD:-2}
      GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS: ${GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS:-60}
      GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS: ${GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS:-600}
      GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT: ${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL: ${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      GATEWAY_IMAGE_CONCURRENCY_ENABLED: ${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS: ${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE: ${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS: ${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS: ${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    networks:
      - app-local
      - infra-postgres
      - infra-redis
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  moderation-adapter:
    image: sub2api-moderation-adapter:responses-v3-chunked
    pull_policy: never
    container_name: sub2api-moderation-adapter
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      RELAY_BASE_URL: ${MODERATION_RELAY_BASE_URL:-}
      RELAY_RESPONSES_PATH: ${MODERATION_RELAY_RESPONSES_PATH:-/responses}
      ADAPTER_API_KEY: ${MODERATION_API_KEY:?MODERATION_API_KEY is required}
      RELAY_API_KEY: ${MODERATION_RELAY_API_KEY:?MODERATION_RELAY_API_KEY is required}
      MODERATION_MODEL: ${MODERATION_MODEL:-gpt-5.4-mini}
      MODERATION_THRESHOLD: ${MODERATION_THRESHOLD:-0.5}
      MAX_CONCURRENCY: ${MODERATION_MAX_CONCURRENCY:-4}
      MAX_INPUT_CHARS: ${MODERATION_MAX_INPUT_CHARS:-600000}
      MAX_INPUTS: ${MODERATION_MAX_INPUTS:-16}
      MAX_REQUEST_BYTES: ${MODERATION_MAX_REQUEST_BYTES:-4194304}
      MODERATION_CHUNK_CHARS: ${MODERATION_CHUNK_CHARS:-50000}
      MODERATION_CHUNK_OVERLAP: ${MODERATION_CHUNK_OVERLAP:-500}
      UPSTREAM_TIMEOUT_MS: ${MODERATION_UPSTREAM_TIMEOUT_MS:-60000}
      ALLOW_HTTP_UPSTREAM: ${MODERATION_ALLOW_HTTP_UPSTREAM:-true}
    networks:
      - app-local
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8787/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-local:
    name: sub2api-local
  infra-postgres:
    external: true
    name: infra-postgres_default
  infra-redis:
    external: true
    name: infra-redis_default
