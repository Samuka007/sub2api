name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag ref to check
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate branch name and upstream metadata
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            feature/*|fix/*|hotfix/*|sync/v*|docs/*|chore/*|refactor/*|test/*|otel/*)
              ;;
            *)
              echo "Unsupported branch name: $HEAD_BRANCH"
              echo "See GIT_WORKFLOW.md for the allowed branch prefixes."
              exit 1
              ;;
          esac

          if [[ "$HEAD_BRANCH" == sync/* ]]; then
            source .upstream-version
            expected_branch="sync/$UPSTREAM_TAG"

            if [[ "$HEAD_BRANCH" != "$expected_branch" ]]; then
              echo "Sync branch $HEAD_BRANCH does not match $expected_branch"
              exit 1
            fi

            git cat-file -e "$UPSTREAM_COMMIT^{commit}"
            git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD
          fi
      - name: Validate linked issue ownership
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: /bin/bash tools/check_pr_issue_ownership.sh

  repository-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Test repository governance gates
        run: |
          python3 -m unittest tools.test_check_repository_governance
          /bin/bash tools/check_pr_issue_ownership_test.sh
          /bin/bash tools/test_review_skill.sh

      - name: Check repository governance
        run: python3 tools/check_repository_governance.py

  deploy-contract:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check deployment scripts
        run: |
          for script in deploy/apple-container.sh deploy/install.sh deploy/tests/*.sh; do
            /bin/bash -n "$script"
          done
      - name: Test Apple container deployment
        run: /bin/bash deploy/tests/apple-container-test.sh
      - name: Test model IQ Compose environment
        run: /bin/bash deploy/tests/model-iq-compose-env-test.sh
      - name: Test install GitHub token handling
        run: /bin/bash deploy/tests/install-github-token-test.sh

  backend-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate model tracing Compose environment
        run: /bin/bash deploy/tests/model-tracing-compose-test.sh
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.26.5"
      - name: Unit tests
        run: make -C backend test-unit
      - name: Integration tests
        run: make -C backend test-integration
      - name: Build backend
        run: make -C backend build

  backend-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.26.5"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          working-directory: backend
          args: --timeout=30m

  frontend-quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Run frontend quality checks
        run: make test-frontend
      - name: Build frontend
        run: make build-frontend

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.26.5"
      - name: Run govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  frontend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Run pnpm audit
        run: pnpm --dir frontend audit --prod --audit-level=high --json > frontend/audit.json || true
      - name: Check audit exceptions
        run: python3 tools/check_pnpm_audit_exceptions.py --audit frontend/audit.json --exceptions .github/audit-exceptions.yml
