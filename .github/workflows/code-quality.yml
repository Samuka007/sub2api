name: Code Quality

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  frontend-lint-security:
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Run frontend lint and security checks in parallel
        run: /bin/bash tools/run_frontend_ci.sh ${{ github.event_name == 'schedule' && '--security-only' || '--lint-security' }}

  frontend-type-test:
    needs: repository-deploy-gate
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Run frontend typecheck and tests in parallel
        run: /bin/bash tools/run_frontend_ci.sh --type-test

  backend-test-build:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.26.5"
      - name: Validate model tracing Compose environment
        run: /bin/bash deploy/tests/model-tracing-compose-test.sh
      - name: Run unit, integration, and build in parallel
        run: /bin/bash tools/run_backend_ci.sh

  frontend-build:
    needs: frontend-lint-security
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Resolve checked out commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir frontend exec vite build
      - name: Upload reusable frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ steps.commit.outputs.sha }}
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 30

  backend-static-security:
    needs: backend-test-build
    if: ${{ always() }}
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.26.5"
      - name: Run golangci-lint
        if: github.event_name != 'schedule'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          working-directory: backend
          args: --timeout=30m
      - name: Run govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  repository-deploy-gate:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Test repository governance gates
        run: |
          python3 -m unittest tools.test_check_repository_governance
          python3 -m unittest tools.test_wait_for_code_quality
          /bin/bash tools/check_pr_issue_ownership_test.sh
          /bin/bash tools/test_check_pr_title.sh
          /bin/bash tools/test_generate_release_notes.sh
          /bin/bash tools/test_review_skill.sh
          /bin/bash tools/test_run_backend_ci.sh
          /bin/bash tools/test_run_frontend_ci.sh
      - name: Check repository governance
        run: python3 tools/check_repository_governance.py
      - name: Check Linux deployment scripts
        run: |
          /bin/bash -n deploy/install.sh
          for script in deploy/tests/*.sh; do
            /bin/bash -n "$script"
          done
      - name: Test Caddy cache configuration
        run: /bin/sh deploy/test-caddyfile-cache.sh
      - name: Test Docker Compose security contract
        run: /bin/sh deploy/tests/docker-compose-security-test.sh
      - name: Test Docker runtime resource build diagnostics
        run: /bin/sh deploy/tests/docker-runtime-resources-output-test.sh
      - name: Test Docker runtime resource contract
        run: /bin/sh deploy/tests/docker-runtime-resources-test.sh
      - name: Test model IQ Compose environment
        run: /bin/bash deploy/tests/model-iq-compose-env-test.sh
      - name: Test install GitHub token handling
        run: /bin/bash deploy/tests/install-github-token-test.sh
