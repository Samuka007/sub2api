name: PR Image
run-name: PR Image #${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]
    # 纯文档/规约/资源类改动不构建镜像
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'AGENTS.md'
      - 'GIT_WORKFLOW.md'
      - 'DEV_GUIDE.md'
      - '.agent/skills/**'
      - 'LICENSE'
      - 'assets/**'
      - '.github/**/*.md'

permissions:
  contents: read
  packages: write

# 同 PR 新 push 取消旧构建，镜像 tag pr-<number> 覆盖更新
concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-pr-image:
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # docker 凭据写入 job 私有目录，避免与并行 job（其他 PR / pre-release / release）
      # 共享 runner 的 ~/.docker/config.json 时互相 logout 覆盖
      - name: Isolate docker credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend (vite → backend/internal/web/dist)
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec vite build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false

      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.26.6"

      - name: Set lowercase owner
        id: lowercase
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare PR tag for GoReleaser
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git tag "pr-$PR_NUMBER" "$HEAD_SHA" 2>/dev/null || true

      - name: Build and push PR image
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate --config=.goreleaser.pr.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: pr-${{ github.event.pull_request.number }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Report image
        env:
          OWNER: ${{ steps.lowercase.outputs.owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          IMAGE="ghcr.io/$OWNER/sub2api:pr-$PR_NUMBER"
          echo "::notice::PR image built: $IMAGE"
          echo "PR image: $IMAGE"