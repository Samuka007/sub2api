name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Annotated tag to release (e.g., release-1.0.0)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only linux/amd64 GHCR image, without binary assets'
        required: false
        type: boolean
        default: false
      sync_version_file:
        description: 'Update VERSION on the default branch after a successful manual release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
      semantic_tag: ${{ steps.resolve.outputs.semantic_tag }}
      tag_sha: ${{ steps.resolve.outputs.tag_sha }}
      release_mode: ${{ steps.resolve.outputs.release_mode }}
      release_runner: ${{ steps.resolve.outputs.release_runner }}
      pre_release_tag: ${{ steps.resolve.outputs.pre_release_tag }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: resolve
        env:
          CANDIDATE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SIMPLE_RELEASE_INPUT: ${{ inputs.simple_release }}
          SIMPLE_RELEASE_VARIABLE: ${{ vars.SIMPLE_RELEASE }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

          TAG_NAME=$CANDIDATE_TAG
          if [[ ! "$TAG_NAME" =~ ^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi
          VERSION=${TAG_NAME#release-}

          if [ "$(git cat-file -t "refs/tags/$TAG_NAME" 2>/dev/null || true)" != tag ]; then
            echo "Release tag must exist and be annotated: $TAG_NAME"
            exit 1
          fi

          git for-each-ref --format='%(contents:body)' "refs/tags/$TAG_NAME" > release-tag-message.md
          if [ -z "$(tr -d '[:space:]' < release-tag-message.md)" ]; then
            echo "Annotated release tag body must not be empty: $TAG_NAME"
            exit 1
          fi

          TAG_SHA=$(git rev-parse "refs/tags/$TAG_NAME^{commit}")
          git merge-base --is-ancestor "$TAG_SHA" "origin/$DEFAULT_BRANCH"

          CURRENT_VERSION=$(git show "origin/$DEFAULT_BRANCH:backend/cmd/server/VERSION" | tr -d '\r\n')
          if [[ ! "$CURRENT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid VERSION on origin/$DEFAULT_BRANCH: $CURRENT_VERSION"
            exit 1
          fi

          IFS=. read -r CANDIDATE_MAJOR CANDIDATE_MINOR CANDIDATE_PATCH <<< "$VERSION"
          IFS=. read -r CURRENT_MAJOR CURRENT_MINOR CURRENT_PATCH <<< "$CURRENT_VERSION"
          if ! ((
            10#$CANDIDATE_MAJOR > 10#$CURRENT_MAJOR ||
            (10#$CANDIDATE_MAJOR == 10#$CURRENT_MAJOR && 10#$CANDIDATE_MINOR > 10#$CURRENT_MINOR) ||
            (10#$CANDIDATE_MAJOR == 10#$CURRENT_MAJOR && 10#$CANDIDATE_MINOR == 10#$CURRENT_MINOR && 10#$CANDIDATE_PATCH > 10#$CURRENT_PATCH)
          )); then
            echo "Release version $VERSION must be greater than default-branch VERSION $CURRENT_VERSION"
            exit 1
          fi

          PRE_RELEASE_TAG=''
          while IFS= read -r candidate; do
            if [ "$(git cat-file -t "refs/tags/$candidate" 2>/dev/null || true)" != tag ]; then
              continue
            fi
            if [ "$(git rev-parse "refs/tags/$candidate^{commit}")" != "$TAG_SHA" ]; then
              continue
            fi
            if [ "$(gh release view "$candidate" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || true)" != true ]; then
              continue
            fi
            PRE_RELEASE_TAG=$candidate
            break
          done < <(git tag --list "pre-release-$VERSION-rc.*" --sort=-version:refname)
          if [ -z "$PRE_RELEASE_TAG" ]; then
            echo "Production release requires a published GitHub pre-release for the same version and commit"
            echo "Expected an annotated pre-release-$VERSION-rc.N tag at $TAG_SHA"
            exit 1
          fi

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ "$SIMPLE_RELEASE_INPUT" = true ]; then
              RELEASE_MODE=simple
            else
              RELEASE_MODE=full
            fi
          elif [ "$SIMPLE_RELEASE_VARIABLE" = true ]; then
            RELEASE_MODE=simple
          else
            RELEASE_MODE=full
          fi

          if [ "$RELEASE_MODE" = simple ]; then
            RELEASE_RUNNER=sub2api-pve
          else
            RELEASE_RUNNER=ubuntu-latest
          fi

          {
            echo "tag_name=$TAG_NAME"
            echo "version=$VERSION"
            echo "semantic_tag=v$VERSION"
            echo "tag_sha=$TAG_SHA"
            echo "release_mode=$RELEASE_MODE"
            echo "release_runner=$RELEASE_RUNNER"
            echo "pre_release_tag=$PRE_RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  quality-gate:
    needs: resolve-release
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/code-quality.yml
    with:
      ref: ${{ needs.resolve-release.outputs.tag_sha }}

  update-version:
    needs: [resolve-release, quality-gate]
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}

      - name: Verify immutable release commit
        env:
          TAG_SHA: ${{ needs.resolve-release.outputs.tag_sha }}
        run: test "$(git rev-parse HEAD)" = "$TAG_SHA"

      - name: Update VERSION file
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: printf '%s\n' "$VERSION" > backend/cmd/server/VERSION

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    needs: [resolve-release, quality-gate]
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}

      - name: Verify immutable release commit
        env:
          TAG_SHA: ${{ needs.resolve-release.outputs.tag_sha }}
        run: test "$(git rev-parse HEAD)" = "$TAG_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: make build-frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [resolve-release, quality-gate, update-version, build-frontend]
    runs-on: ${{ needs.resolve-release.outputs.release_runner }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.tag_name }}

      - name: Verify immutable release commit
        env:
          TAG_SHA: ${{ needs.resolve-release.outputs.tag_sha }}
        run: test "$(git rev-parse HEAD)" = "$TAG_SHA"

      - name: Revalidate version against default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          CURRENT_VERSION=$(git show "origin/$DEFAULT_BRANCH:backend/cmd/server/VERSION" | tr -d '\r\n')
          if [[ ! "$CURRENT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid VERSION on origin/$DEFAULT_BRANCH: $CURRENT_VERSION"
            exit 1
          fi
          IFS=. read -r CANDIDATE_MAJOR CANDIDATE_MINOR CANDIDATE_PATCH <<< "$VERSION"
          IFS=. read -r CURRENT_MAJOR CURRENT_MINOR CURRENT_PATCH <<< "$CURRENT_VERSION"
          if ! ((
            10#$CANDIDATE_MAJOR > 10#$CURRENT_MAJOR ||
            (10#$CANDIDATE_MAJOR == 10#$CURRENT_MAJOR && 10#$CANDIDATE_MINOR > 10#$CURRENT_MINOR) ||
            (10#$CANDIDATE_MAJOR == 10#$CURRENT_MAJOR && 10#$CANDIDATE_MINOR == 10#$CURRENT_MINOR && 10#$CANDIDATE_PATCH > 10#$CURRENT_PATCH)
          )); then
            echo "Release version $VERSION must still be greater than default-branch VERSION $CURRENT_VERSION"
            exit 1
          fi

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: ${{ needs.resolve-release.outputs.release_mode == 'full' }}
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.26.5"

      - name: Set up QEMU
        if: needs.resolve-release.outputs.release_mode == 'full'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare semantic tag for GoReleaser OSS
        env:
          SEMANTIC_TAG: ${{ needs.resolve-release.outputs.semantic_tag }}
          TAG_SHA: ${{ needs.resolve-release.outputs.tag_sha }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$SEMANTIC_TAG" >/dev/null; then
            test "$(git rev-parse "refs/tags/$SEMANTIC_TAG^{commit}")" = "$TAG_SHA"
          else
            git tag "$SEMANTIC_TAG" "$TAG_SHA"
          fi

      - name: Read annotated tag body
        env:
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: git for-each-ref --format='%(contents:body)' "refs/tags/$TAG_NAME" > release-tag-message.md

      - name: Set lowercase owner for registry
        id: lowercase
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Select GoReleaser configuration
        id: release-config
        env:
          RELEASE_MODE: ${{ needs.resolve-release.outputs.release_mode }}
        run: |
          if [ "$RELEASE_MODE" = simple ]; then
            echo 'path=.goreleaser.simple.yaml' >> "$GITHUB_OUTPUT"
          else
            echo 'path=.goreleaser.yaml' >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate --config=${{ steps.release-config.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.resolve-release.outputs.semantic_tag }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME || 'skip' }}

      - name: Generate release notes
        env:
          RELEASE_MODE: ${{ needs.resolve-release.outputs.release_mode }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          PRE_RELEASE_TAG: ${{ needs.resolve-release.outputs.pre_release_tag }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          {
            echo 'Sub2API is an AI API gateway platform for distributing and managing subscription quotas.'
            echo
            cat release-tag-message.md
            echo "Promoted from candidate: $PRE_RELEASE_TAG"
            echo
            echo 'Immutable GHCR image:'
            echo '```bash'
            echo "docker pull ghcr.io/alle-group/sub2api:$VERSION"
            echo '```'
            echo
            if [ "$RELEASE_MODE" = full ]; then
              echo 'Download platform archives from the assets below.'
            else
              echo 'Simple release: linux/amd64 GHCR image only; no binary attachments.'
            fi
          } > release-notes.md
          # Append categorized commit history since the previous release.
          commit_section="$(/bin/bash tools/generate_release_notes.sh || true)"
          if [ -n "$commit_section" ]; then
            printf '\n' >> release-notes.md
            printf '%s\n' "$commit_section" >> release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ needs.resolve-release.outputs.release_mode }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_MODE" = full ]; then
            gh release create "$TAG_NAME" \
              dist/*.tar.gz dist/*.zip dist/checksums.txt \
              --verify-tag \
              --title "Sub2API $VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "Sub2API $VERSION (Simple)" \
              --notes-file release-notes.md
          fi

      - name: Update Docker Hub description
        if: needs.resolve-release.outputs.release_mode == 'full' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/sub2api
          short-description: Sub2API - AI API Gateway Platform
          readme-filepath: ./deploy/DOCKER.md

      - name: Send Telegram notification
        if: needs.resolve-release.outputs.release_mode == 'full'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo 'Telegram credentials not configured, skipping notification'
            exit 0
          fi

          TAG_MESSAGE=$(cat release-tag-message.md)
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi
          MESSAGE=$(printf 'Sub2API release %s\n\n%s\n\nDocker:\ndocker pull ghcr.io/alle-group/sub2api:%s\n\nhttps://github.com/%s/releases/tag/%s' \
            "$VERSION" "$TAG_MESSAGE" "$VERSION" "$REPOSITORY" "$TAG_NAME")
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
              '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')"

  sync-version-file:
    needs: [resolve-release, release]
    if: ${{ needs.release.result == 'success' && (github.event_name == 'push' || inputs.sync_version_file) }}
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "VERSION file already matches $VERSION"
            exit 0
          fi
          if [[ ! "$CURRENT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid VERSION on $DEFAULT_BRANCH: $CURRENT_VERSION"
            exit 1
          fi
          IFS=. read -r CANDIDATE_MAJOR CANDIDATE_MINOR CANDIDATE_PATCH <<< "$VERSION"
          IFS=. read -r CURRENT_MAJOR CURRENT_MINOR CURRENT_PATCH <<< "$CURRENT_VERSION"
          if ! ((
            10#$CANDIDATE_MAJOR > 10#$CURRENT_MAJOR ||
            (10#$CANDIDATE_MAJOR == 10#$CURRENT_MAJOR && 10#$CANDIDATE_MINOR > 10#$CURRENT_MINOR) ||
            (10#$CANDIDATE_MAJOR == 10#$CURRENT_MAJOR && 10#$CANDIDATE_MINOR == 10#$CURRENT_MINOR && 10#$CANDIDATE_PATCH > 10#$CURRENT_PATCH)
          )); then
            echo "Refusing to change VERSION from $CURRENT_VERSION to $VERSION"
            exit 1
          fi

          printf '%s\n' "$VERSION" > backend/cmd/server/VERSION
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          git push origin "HEAD:$DEFAULT_BRANCH"
