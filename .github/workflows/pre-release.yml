name: Pre-release
run-name: Pre-release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'pre-release-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Annotated pre-release tag (e.g., pre-release-1.2.0-rc.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: pre-release-publish
  cancel-in-progress: false

jobs:
  resolve-candidate:
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
      semantic_tag: ${{ steps.resolve.outputs.semantic_tag }}
      tag_sha: ${{ steps.resolve.outputs.tag_sha }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate pre-release tag
        id: resolve
        env:
          CANDIDATE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

          TAG_NAME=$CANDIDATE_TAG
          if [[ ! "$TAG_NAME" =~ ^pre-release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)$ ]]; then
            echo "Invalid pre-release tag: $TAG_NAME"
            exit 1
          fi
          VERSION=${TAG_NAME#pre-release-}
          BASE_VERSION=${VERSION%%-rc.*}

          if [ "$(git cat-file -t "refs/tags/$TAG_NAME" 2>/dev/null || true)" != tag ]; then
            echo "Pre-release tag must exist and be annotated: $TAG_NAME"
            exit 1
          fi
          git for-each-ref --format='%(contents:body)' "refs/tags/$TAG_NAME" > pre-release-tag-message.md
          if [ -z "$(tr -d '[:space:]' < pre-release-tag-message.md)" ]; then
            echo "Annotated pre-release tag body must not be empty: $TAG_NAME"
            exit 1
          fi

          TAG_SHA=$(git rev-parse "refs/tags/$TAG_NAME^{commit}")
          git merge-base --is-ancestor "$TAG_SHA" "origin/$DEFAULT_BRANCH"

          CURRENT_VERSION=$(git show "origin/$DEFAULT_BRANCH:backend/cmd/server/VERSION" | tr -d '\r\n')
          if [[ ! "$CURRENT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid VERSION on origin/$DEFAULT_BRANCH: $CURRENT_VERSION"
            exit 1
          fi
          IFS=. read -r CANDIDATE_MAJOR CANDIDATE_MINOR CANDIDATE_PATCH <<< "$BASE_VERSION"
          IFS=. read -r CURRENT_MAJOR CURRENT_MINOR CURRENT_PATCH <<< "$CURRENT_VERSION"
          if ! ((
            10#$CANDIDATE_MAJOR > 10#$CURRENT_MAJOR ||
            (10#$CANDIDATE_MAJOR == 10#$CURRENT_MAJOR && 10#$CANDIDATE_MINOR > 10#$CURRENT_MINOR) ||
            (10#$CANDIDATE_MAJOR == 10#$CURRENT_MAJOR && 10#$CANDIDATE_MINOR == 10#$CURRENT_MINOR && 10#$CANDIDATE_PATCH > 10#$CURRENT_PATCH)
          )); then
            echo "Pre-release base version $BASE_VERSION must be greater than default-branch VERSION $CURRENT_VERSION"
            exit 1
          fi

          {
            echo "tag_name=$TAG_NAME"
            echo "version=$VERSION"
            echo "semantic_tag=v$VERSION"
            echo "tag_sha=$TAG_SHA"
          } >> "$GITHUB_OUTPUT"

  quality-gate:
    needs: resolve-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.quality.outputs.run_id }}
      run_url: ${{ steps.quality.outputs.run_url }}
      artifact_name: ${{ steps.quality.outputs.artifact_name }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-candidate.outputs.tag_name }}
      - name: Wait for existing Code Quality run
        id: quality
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SHA: ${{ needs.resolve-candidate.outputs.tag_sha }}
        run: python3 tools/wait_for_code_quality.py --commit "$TAG_SHA"

  publish-candidate:
    needs: [resolve-candidate, quality-gate]
    runs-on: [self-hosted, Linux, X64, sub2api-pve]
    environment: pre-release
    steps:
      # docker 凭据写入 job 私有目录，避免与并行 job 共享 runner 的
      # ~/.docker/config.json 时被互相 logout 覆盖
      - name: Isolate docker credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Checkout immutable candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-candidate.outputs.tag_name }}

      - name: Verify immutable candidate commit
        env:
          TAG_SHA: ${{ needs.resolve-candidate.outputs.tag_sha }}
        run: test "$(git rev-parse HEAD)" = "$TAG_SHA"

      - name: Reject an existing pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve-candidate.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Pre-release already exists and is immutable: $TAG_NAME"
            exit 1
          fi

      - name: Download verified frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.quality-gate.outputs.artifact_name }}
          path: backend/internal/web/dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.quality-gate.outputs.run_id }}

      - name: Set candidate VERSION
        env:
          VERSION: ${{ needs.resolve-candidate.outputs.version }}
        run: printf '%s\n' "$VERSION" > backend/cmd/server/VERSION

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false

      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.http_proxy=http://10.0.100.240:10808
            env.https_proxy=http://10.0.100.240:10808

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing image tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sub2api:${{ needs.resolve-candidate.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE,,}" >/dev/null 2>&1; then
            echo "Pre-release image tag already exists and is immutable: ${IMAGE,,}"
            exit 1
          fi

      - name: Prepare semantic tag for GoReleaser OSS
        env:
          SEMANTIC_TAG: ${{ needs.resolve-candidate.outputs.semantic_tag }}
          TAG_SHA: ${{ needs.resolve-candidate.outputs.tag_sha }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$SEMANTIC_TAG" >/dev/null; then
            test "$(git rev-parse "refs/tags/$SEMANTIC_TAG^{commit}")" = "$TAG_SHA"
          else
            git tag "$SEMANTIC_TAG" "$TAG_SHA"
          fi

      - name: Set lowercase owner for registry
        id: lowercase
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish pre-release image
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate --config=.goreleaser.simple.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.resolve-candidate.outputs.semantic_tag }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}

      - name: Smoke immutable pre-release image
        id: image
        env:
          IMAGE: ghcr.io/${{ steps.lowercase.outputs.owner }}/sub2api:${{ needs.resolve-candidate.outputs.version }}
          VERSION: ${{ needs.resolve-candidate.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          SUB2API_RUNTIME_RESOURCE_IMAGE="$IMAGE" /bin/sh deploy/tests/docker-runtime-resources-test.sh
          docker run --rm "$IMAGE" --version 2>&1 | tee image-version.txt
          grep -F "Sub2API $VERSION" image-version.txt
          REPO_DIGEST=$(docker image inspect "$IMAGE" --format '{{ index .RepoDigests 0 }}')
          DIGEST=${REPO_DIGEST##*@}
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $DIGEST"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Read annotated tag body
        env:
          TAG_NAME: ${{ needs.resolve-candidate.outputs.tag_name }}
        run: git for-each-ref --format='%(contents:body)' "refs/tags/$TAG_NAME" > pre-release-tag-message.md

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.lowercase.outputs.owner }}/sub2api:${{ needs.resolve-candidate.outputs.version }}
          TAG_NAME: ${{ needs.resolve-candidate.outputs.tag_name }}
          TAG_SHA: ${{ needs.resolve-candidate.outputs.tag_sha }}
          VERSION: ${{ needs.resolve-candidate.outputs.version }}
        run: |
          set -euo pipefail
          {
            cat pre-release-tag-message.md
            echo
            echo 'Test-server candidate (deploy this exact digest):'
            echo '```bash'
            echo "docker pull $IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Commit: $TAG_SHA"
            echo 'Production release is blocked until test-server request, billing, stability, and rollback evidence is recorded.'
          } > pre-release-notes.md
          gh release create "$TAG_NAME" \
            --verify-tag \
            --prerelease \
            --title "Sub2API $VERSION (Pre-release)" \
            --notes-file pre-release-notes.md

      - name: Publish candidate summary
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.lowercase.outputs.owner }}/sub2api:${{ needs.resolve-candidate.outputs.version }}
          TAG_SHA: ${{ needs.resolve-candidate.outputs.tag_sha }}
        run: |
          {
            echo '## Pre-release candidate'
            echo
            echo "- Commit: \`$TAG_SHA\`"
            echo "- Image: \`$IMAGE@$DIGEST\`"
            echo '- Next gate: deploy this digest to the test server and record request-chain, billing, stability, and rollback evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
